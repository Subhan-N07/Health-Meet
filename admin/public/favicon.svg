<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Shape - Shield/House Hybrid -->
  <path d="M 250,30 L 450,120 L 450,350 C 450,420 360,470 250,490 C 140,470 50,420 50,350 L 50,120 Z" 
        fill="#f0fdfa" stroke="#0d9488" stroke-width="10"/>
  
  <!-- Medical Symbol - Caduceus Inspired -->
  <g transform="translate(250, 230) scale(1.2)">
    <!-- Staff -->
    <rect x="-8" y="-100" width="16" height="200" rx="8" fill="#0d9488"/>
    
    <!-- Wings -->
    <path d="M -8,-40 C -60,-20 -70,20 -8,40" stroke="#14b8a6" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M 8,-40 C 60,-20 70,20 8,40" stroke="#14b8a6" stroke-width="12" fill="none" stroke-linecap="round"/>
    
    <!-- Snakes -->
    <path d="M -5,-90 C -30,-70 -40,-40 -20,-20 C 0,0 -20,20 -40,30 C -60,40 -60,70 -5,90" 
          stroke="#0891b2" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M 5,-90 C 30,-70 40,-40 20,-20 C 0,0 20,20 40,30 C 60,40 60,70 5,90" 
          stroke="#0891b2" stroke-width="10" fill="none" stroke-linecap="round"/>
    
    <!-- Snake Heads -->
    <circle cx="-5" cy="-95" r="8" fill="#0891b2"/>
    <circle cx="5" cy="-95" r="8" fill="#0891b2"/>
    
    <!-- Snake Eyes -->
    <circle cx="-7" cy="-97" r="2" fill="white"/>
    <circle cx="7" cy="-97" r="2" fill="white"/>
  </g>
  
  <!-- Calendar Squares -->
  <g transform="translate(250, 355) scale(1.3)">
    <rect x="-80" y="-30" width="50" height="50" rx="10" fill="#0d9488" opacity="0.8"/>
    <rect x="-20" y="-30" width="50" height="50" rx="10" fill="#0d9488"/>
    <rect x="40" y="-30" width="50" height="50" rx="10" fill="#0d9488" opacity="0.8"/>
    
    <!-- Check Mark -->
    <path d="M -5,0 L 5,10 L 20,-10" stroke="white" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- App Name -->
  <text x="250" y="450" 
        font-family="Arial, sans-serif" 
        font-weight="bold" 
        font-size="54" 
        text-anchor="middle" 
        fill="#134e4a">
    Health<tspan fill="#0891b2">Meet</tspan>
  </text>
  
  <!-- Circular Pulse Effect -->
  <circle cx="250" cy="230" r="160" stroke="#14b8a6" stroke-width="4" fill="none" opacity="0.3"/>
  <circle cx="250" cy="230" r="190" stroke="#14b8a6" stroke-width="3" fill="none" opacity="0.2"/>
</svg>